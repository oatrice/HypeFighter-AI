<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrameWhisper - Interactive Fighter Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Sarabun', sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    .thought-bubble {
      position: absolute;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 20px;
      padding: 10px 16px;
      max-width: 240px;
      font-size: 14px;
      font-weight: bold;
      color: #222222;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.4);
      transform: translate(-50%, -100%);
      transition: left 0.05s ease-out, top 0.05s ease-out;
      display: none;
    }
    .thought-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }
    .thought-bubble::before {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 15px 12px 0;
      border-style: solid;
      border-color: #111111 transparent;
      display: block;
      width: 0;
    }
    .stance-badge {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      background: #ff4757;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    #hype-meter {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #ffa502;
      border-radius: 8px;
      padding: 10px 15px;
      color: #ffffff;
      font-size: 13px;
    }
    .bar {
      width: 160px;
      height: 12px;
      background: #333333;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 5px;
    }
    .fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffa502);
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bubble" class="thought-bubble">
      <div id="stance" class="stance-badge">WHIFF PUNISH</div>
      <div id="thought-text">เขาต่อยไปทางขวาเปิดหลังโล่ง สวนกลับตรงนี้เลย!</div>
    </div>
  </div>

  <div id="hype-meter">
    <div>🔥 CROWD HYPE METER</div>
    <div class="bar"><div id="hype-fill" class="fill"></div></div>
  </div>

  <script>
    // Connect to agent-core WebSocket stream
    const ws = new WebSocket("ws://127.0.0.1:8765");
    const bubble = document.getElementById("bubble");
    const stance = document.getElementById("stance");
    const thoughtText = document.getElementById("thought-text");
    const hypeFill = document.getElementById("hype-fill");

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === "AI_THOUGHT") {
          bubble.style.display = "block";
          stance.innerText = data.stance || "TACTICAL";
          thoughtText.innerText = data.thought || "...";
          
          // Map game coordinates to screen coordinates
          const screenX = window.innerWidth / 2 + (data.pos_x || 0) * 1.5;
          const screenY = window.innerHeight * 0.75 + (data.pos_y || 0) * 1.5 - 120;
          bubble.style.left = `${screenX}px`;
          bubble.style.top = `${screenY}px`;
        }
        if (data.type === "HYPE_UPDATE") {
          hypeFill.style.width = `${Math.min(100, data.hype_percentage)}%`;
        }
      } catch (err) {
        console.error("Overlay parsing error", err);
      }
    };
  </script>
</body>
</html>
